# Local development: PostgreSQL + API + frontend.
#   docker compose up --build
#   docker compose run --rm api make all FILES="/data-import/2024_LoL_esports_match_data_from_OraclesElixir.csv"
# Put downloaded Oracle's Elixir CSVs in ./data-import first.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: esports
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/esports
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./data-import:/data-import:ro
      - ./machine_learning/models/artifacts:/app/machine_learning/models/artifacts
    depends_on:
      db: { condition: service_healthy }
  web:
    image: node:22-alpine
    working_dir: /app
    # reinstall packages only when package-lock.json changed
    command: sh -c "cmp -s package-lock.json node_modules/.installed-lock || (npm ci && cp package-lock.json node_modules/.installed-lock); npm run dev -- -H 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    volumes: [./frontend:/app, web_node_modules:/app/node_modules]
    depends_on: [api]
volumes:
  pgdata:
  web_node_modules: